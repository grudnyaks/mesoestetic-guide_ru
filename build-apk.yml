name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v5

      - name: Проверить файлы
        run: |
          ls -la
          for f in index.html version.json package.json capacitor.config.json android-theme.py; do
            if [ ! -f "$f" ]; then
              echo "::error::Не найден файл $f в корне репозитория. Загрузите его через Add file → Upload files."
              exit 1
            fi
          done

      - name: Сверить версию справочника
        run: |
          V=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          if ! grep -q "<meta name=\"app-version\" content=\"$V\">" index.html; then
            echo "::error::Версия в version.json ($V) не совпадает с <meta name=\"app-version\"> в index.html. Обновите обе."
            exit 1
          fi
          if ! grep -q "var BUNDLED = '$V';" index.html; then
            echo "::error::Версия $V не совпадает с BUNDLED в index.html."
            exit 1
          fi
          echo "Версия справочника: $V"

      - name: Подготовить папку www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Создать Android-проект
        run: npx cap add android

      - name: Поставить иконку и заставку
        run: |
          if [ -f android-res.zip ]; then
            unzip -o android-res.zip -d android/app/src/main/res/
          else
            echo "::warning::android-res.zip не найден — будет стандартная иконка."
          fi

      - name: Тема Android, чёрный старт, версия APK
        run: python3 android-theme.py

      - name: Перенести справочник в Android-проект
        run: npx cap sync android

      - name: Собрать и подписать APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          cd android && chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            # постоянный ключ: каждая новая версия ставится поверх старой, данные сохраняются
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon --stacktrace
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias mesoestetic \
              --ks-pass pass:mesoestetic-guide-ru --key-pass pass:mesoestetic-guide-ru \
              --out "../dist/mesoestetic-guide-$VER.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "../dist/mesoestetic-guide-$VER.apk" | head -3
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_B64 — APK подписан временным ключом и не встанет поверх прошлой версии."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/mesoestetic-guide-$VER.apk"
          fi
          cp "../dist/mesoestetic-guide-$VER.apk" ../dist/mesoestetic-guide.apk

      - name: Выложить APK в сборку
        uses: actions/upload-artifact@v4
        with:
          name: mesoestetic-guide-${{ env.VER }}
          path: dist/mesoestetic-guide-${{ env.VER }}.apk
          retention-days: 30

      - name: Опубликовать в Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          NOTES=$(python3 -c "import json;d=json.load(open('version.json'));print(d.get('notes') or 'Обновление справочника')")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/mesoestetic-guide-$VER.apk" dist/mesoestetic-guide.apk --clobber
          else
            gh release create "$TAG" "dist/mesoestetic-guide-$VER.apk" dist/mesoestetic-guide.apk \
              --title "mesoestetic $VER" --notes "$NOTES

          Установка: скачайте mesoestetic-guide-$VER.apk и откройте на телефоне." --target "$GITHUB_SHA" --latest
          fi
          {
            echo "### APK $VER"
            echo "Постоянная ссылка на свежую версию: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/mesoestetic-guide.apk"
          } >> "$GITHUB_STEP_SUMMARY"
